{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-secondary mb-3"></i>
                <h2 class="fw-bold">建立帳號</h2>
                <p class="text-secondary">加入我們，開啟智慧料理之旅</p>
            </div>
            
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">使用者名稱</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">設定密碼</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary-gradient" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">註冊帳號</button>
                </div>
                <div class="text-center text-secondary small">
                    已經有帳號了？ <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none">返回登入</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
