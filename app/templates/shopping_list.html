{% extends "base.html" %}

{% block content %}
<div class="row fade-in-up">
    <div class="col-md-4 mb-4">
        <div class="glass-card position-sticky" style="top: 100px;">
            <h4 class="fw-bold mb-4"><i class="fa-solid fa-cart-plus me-2 text-primary"></i>加入購物清單</h4>
            <form action="{{ url_for('inventory.update_shopping_list') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">需要買什麼？</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="例如：牛奶">
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label for="quantity" class="form-label">數量</label>
                        <input type="text" class="form-control" id="quantity" name="quantity" placeholder="例如：1">
                    </div>
                    <div class="col-6">
                        <label for="unit" class="form-label">單位</label>
                        <input type="text" class="form-control" id="unit" name="unit" placeholder="例如：瓶">
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary-gradient text-white" style="background: linear-gradient(135deg, #10b981, #059669);">新增項目</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="glass-card">
            <h4 class="fw-bold mb-4"><i class="fa-solid fa-list-check me-2 text-success"></i>待採買清單</h4>
            
            {% if items %}
            <div class="list-group list-group-flush bg-transparent">
                {% for item in items %}
                <div class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between align-items-center py-3 {% if item.is_bought %}opacity-50{% endif %}">
                    <div class="d-flex align-items-center">
                        <form action="{{ url_for('inventory.toggle_shopping_list', id=item.id) }}" method="POST" class="me-3 m-0">
                            <button type="submit" class="btn btn-sm {% if item.is_bought %}btn-success{% else %}btn-outline-secondary{% endif %} rounded-circle" style="width: 28px; height: 28px; padding: 0; line-height: 26px;">
                                <i class="fa-solid fa-check {% if not item.is_bought %}opacity-0{% endif %}"></i>
                            </button>
                        </form>
                        <div>
                            <h5 class="mb-0 {% if item.is_bought %}text-decoration-line-through text-secondary{% endif %}">{{ item.name }}</h5>
                            {% if item.quantity or item.unit %}
                            <small class="text-secondary">{{ item.quantity or '' }} {{ item.unit or '' }}</small>
                            {% endif %}
                        </div>
                    </div>
                    <form action="{{ url_for('inventory.delete_shopping_list', id=item.id) }}" method="POST" class="m-0">
                        <button type="submit" class="btn text-danger btn-sm px-2"><i class="fa-solid fa-xmark fa-lg"></i></button>
                    </form>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="text-center py-5">
                <i class="fa-solid fa-cart-arrow-down fa-4x text-secondary mb-3 opacity-50"></i>
                <h5 class="text-secondary">購物車空空的</h5>
                <p class="text-secondary small">準備去超市前，先在這裡列出想買的清單吧！</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
