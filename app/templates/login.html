{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-right-to-bracket fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">歡迎回來</h2>
                <p class="text-secondary">登入您的 AI 食譜帳號</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">使用者名稱</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary-gradient">登入</button>
                </div>
                <div class="text-center text-secondary small">
                    還沒有帳號嗎？ <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none">立即註冊</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
